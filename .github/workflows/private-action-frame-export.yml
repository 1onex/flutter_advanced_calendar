name: Temporary Piped source recovery

on:
  push:
    branches:
      - agent/trial-obby-frame-export-test
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  recover-piped:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4

      - name: Install matching FFmpeg and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          curl -fL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir ffmpeg-master
          tar -xJf ffmpeg.tar.xz -C ffmpeg-master --strip-components=1
          echo "$PWD/ffmpeg-master/bin" >> "$GITHUB_PATH"
          ffmpeg-master/bin/ffmpeg -version | tee ffmpeg-version.txt

      - name: Query Piped APIs in parallel
        shell: bash
        run: |
          set -euo pipefail
          cat > piped-hosts.txt <<'EOF'
          https://pa.il.ax
          https://piped-api.privacy.com.de
          https://api.piped.projectsegfau.lt
          https://pipedapi.in.projectsegfau.lt
          https://pipedapi.us.projectsegfau.lt
          https://watchapi.whatever.social
          https://api.piped.privacydev.net
          https://pipedapi.palveluntarjoaja.eu
          https://pipedapi.smnz.de
          https://pipedapi.adminforge.de
          https://pipedapi.qdi.fi
          https://piped-api.hostux.net
          https://pdapi.vern.cc
          https://pipedapi.pfcd.me
          https://pipedapi.frontendfriendly.xyz
          https://api.piped.yt
          https://pipedapi.astartes.nl
          https://pipedapi.osphost.fi
          https://pipedapi.simpleprivacy.fr
          https://pipedapi.drgns.space
          https://piapi.ggtyler.dev
          https://api.watch.pluto.lat
          https://piped-backend.seitan-ayoub.lol
          https://pipedapi.owo.si
          https://pipedapi-libre.kavin.rocks
          https://pipedapi.rivo.lol
          https://pipedapi.leptons.xyz
          EOF
          mkdir responses
          export VIDEO_ID='qCxf4NoqXU0'
          export UA='TrialObbyCorpusRecovery/1.0 (+https://github.com/1onex/flutter_advanced_calendar/pull/1)'
          cat piped-hosts.txt | xargs -P 16 -I{} bash -c '
            api="$1"
            safe=$(printf "%s" "$api" | sed "s#https://##" | tr -cs "A-Za-z0-9" "_")
            code=$(curl -sS -L --connect-timeout 5 --max-time 25 -A "$UA" -o "responses/$safe.json" -w "%{http_code}" "$api/streams/$VIDEO_ID" || true)
            printf "%s\t%s\t%s\n" "$api" "$code" "$(wc -c < "responses/$safe.json" 2>/dev/null || echo 0)" > "responses/$safe.status"
          ' _ {}
          cat responses/*.status | sort | tee piped-status.tsv
          : > candidate-streams.tsv
          : > piped-results.log
          while IFS=$'\t' read -r api code bytes; do
            safe=$(printf '%s' "$api" | sed 's#https://##' | tr -cs 'A-Za-z0-9' '_')
            json="responses/$safe.json"
            echo "===== $api code=$code bytes=$bytes =====" | tee -a piped-results.log
            if jq -e '.videoStreams | type == "array" and length > 0' "$json" >/dev/null 2>&1; then
              echo "SUCCESS title=$(jq -r '.title // ""' "$json") duration=$(jq -r '.duration // 0' "$json") streams=$(jq '.videoStreams|length' "$json")" | tee -a piped-results.log
              jq -r --arg api "$api" '
                .videoStreams[]
                | select((.mimeType // "") | startswith("video/mp4"))
                | [$api, (.quality // "unknown"), (.codec // "unknown"), ((.videoOnly // false)|tostring), ((.bitrate // 0)|tostring), .url]
                | @tsv
              ' "$json" >> candidate-streams.tsv
            else
              head -c 300 "$json" | tr '\n' ' ' | tee -a piped-results.log
              echo | tee -a piped-results.log
            fi
          done < piped-status.tsv
          sort -u candidate-streams.tsv -o candidate-streams.tsv
          cat candidate-streams.tsv | tee -a piped-results.log
          test -s candidate-streams.tsv || { echo 'No Piped API returned MP4 streams.' >&2; exit 11; }

      - name: Download prioritized source candidates
        shell: bash
        run: |
          set +e
          set +o pipefail
          UA='TrialObbyCorpusRecovery/1.0 (+https://github.com/1onex/flutter_advanced_calendar/pull/1)'
          mkdir sources
          : > downloaded-sources.tsv
          awk -F '\t' '$2 ~ /^(360p|360|480p|480|240p|240|720p|720)$/ {priority=9; if ($2 ~ /^360/) priority=1; else if ($2 ~ /^480/) priority=2; else if ($2 ~ /^240/) priority=3; if (tolower($3) ~ /(h264|avc)/) priority-=0.5; print priority "\t" $0}' candidate-streams.tsv | sort -n -k1,1 | cut -f2- > prioritized-streams.tsv
          index=0
          while IFS=$'\t' read -r api quality codec video_only bitrate url; do
            index=$((index+1))
            safe=$(printf '%s-%s-%s' "$api" "$quality" "$codec" | tr -cs 'A-Za-z0-9' '_')
            out="sources/source-$(printf '%02d' "$index")-${safe}.mp4"
            echo "DOWNLOAD api=$api quality=$quality codec=$codec videoOnly=$video_only bitrate=$bitrate"
            curl -fL --connect-timeout 10 --retry 2 --max-time 900 -A "$UA" -o "$out" "$url"
            rc=$?
            if [ "$rc" -eq 0 ] && [ -f "$out" ] && [ "$(stat -c %s "$out")" -gt 1000000 ]; then
              printf '%s\t%s\t%s\t%s\t%s\n' "$out" "$api" "$quality" "$codec" "$video_only" >> downloaded-sources.tsv
            else
              rm -f "$out"
            fi
            [ "$(wc -l < downloaded-sources.tsv)" -ge 6 ] && break
            [ "$index" -ge 14 ] && break
          done < prioritized-streams.tsv
          cat downloaded-sources.tsv
          test -s downloaded-sources.tsv || { echo 'No candidate stream downloaded.' >&2; exit 12; }

      - name: Probe exact extraction against immutable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          cat > expected-early.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          EOF
          mkdir probes
          : > probe-results.txt
          match=''
          while IFS=$'\t' read -r src api quality codec video_only; do
            ffprobe -v error -show_streams -show_format "$src" > "$(basename "$src").ffprobe.txt" || continue
            for vf in 'fps=2' 'fps=2,scale=360:640' 'fps=2,scale=360:640:flags=lanczos'; do
              out="probes/$(printf '%s-%s' "$(basename "$src")" "$vf" | tr -cs 'A-Za-z0-9' '_')"
              mkdir -p "$out"
              ffmpeg -hide_banner -loglevel warning -t 55 -i "$src" -vf "$vf" -start_number 1 "$out/frame_%06d.jpg"
              ok=1
              while read -r name expected; do
                actual=$(git hash-object "$out/$name")
                echo "$src $vf $name actual=$actual expected=$expected" | tee -a probe-results.txt
                [ "$actual" = "$expected" ] || ok=0
              done < expected-early.txt
              if [ "$ok" -eq 1 ]; then match="$src|$vf"; break 2; fi
            done
          done < downloaded-sources.tsv
          printf '%s\n' "$match" > exact-match.txt
          test -n "$match" || { echo 'Downloaded streams did not reproduce Git JPEGs.' >&2; exit 20; }

      - name: Extract and verify full corpus
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r src vf < exact-match.txt
          mkdir frames
          ffmpeg -hide_banner -loglevel warning -i "$src" -vf "$vf" -start_number 1 frames/frame_%06d.jpg
          count=$(find frames -maxdepth 1 -type f -name 'frame_*.jpg' | wc -l)
          [ "$count" -eq 3484 ] || { echo "Expected 3484 frames, got $count" >&2; exit 21; }
          cat > expected-full.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          frame_001000.jpg 470e4d441726615196b08f4fbfe3a03f5a8f79a9
          frame_002000.jpg ba6879062f85cf2bbcd6fdece8df21f94e5cf1b3
          frame_003000.jpg 85be8114fa583ac9bdaa6fb3f0ae51b5c78bf097
          frame_003484.jpg 2297b15b6de24058f3a8c63d655fe7a61b0c6a3c
          EOF
          while read -r name expected; do
            actual=$(git hash-object "frames/$name")
            echo "$name actual=$actual expected=$expected"
            [ "$actual" = "$expected" ] || exit 22
          done < expected-full.txt
          find frames -maxdepth 1 -type f -name '*.jpg' -print0 | sort -z | xargs -0 sha256sum > frames-sha256.txt
          printf 'source_video=qCxf4NoqXU0\nsource_git_commit=9c62d9489d9f057835f8a62af3a620fa6f4a89a0\nframe_count=%s\nsource_file=%s\nvf=%s\n' "$count" "$src" "$vf" > source.txt

      - name: Upload exact corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-3484-frames-exact-piped
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            frames/
            frames-sha256.txt
            expected-full.txt
            source.txt
            ffmpeg-version.txt
            piped-status.tsv
            candidate-streams.tsv
            downloaded-sources.tsv
            piped-results.log
            source-*.ffprobe.txt
            probe-results.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-piped-recovery-diagnostics
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
          path: |
            responses/
            piped-hosts.txt
            piped-status.tsv
            candidate-streams.tsv
            prioritized-streams.tsv
            downloaded-sources.tsv
            piped-results.log
            sources/
            source-*.ffprobe.txt
            probes/
            expected-early.txt
            probe-results.txt
            exact-match.txt
            ffmpeg-version.txt
