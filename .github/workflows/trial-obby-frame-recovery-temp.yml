name: Temporary Trial Obby frame recovery

on:
  push:
    branches:
      - agent/trial-obby-frame-export-test
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-through-tor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4

      - name: Install Tor, yt-dlp challenge support and matching FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor netcat-openbsd
          python -m pip install --upgrade 'yt-dlp[default,curl-cffi]'
          curl -fL --retry 3 -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir ffmpeg-master
          tar -xJf ffmpeg.tar.xz -C ffmpeg-master --strip-components=1
          echo "$PWD/ffmpeg-master/bin" >> "$GITHUB_PATH"
          ffmpeg-master/bin/ffmpeg -version | tee ffmpeg-version.txt
          python -m yt_dlp --version | tee yt-dlp-version.txt
          sudo sed -i 's/^#ControlPort 9051/ControlPort 9051/' /etc/tor/torrc
          echo 'CookieAuthentication 0' | sudo tee -a /etc/tor/torrc
          echo 'SocksPort 9050' | sudo tee -a /etc/tor/torrc
          sudo systemctl restart tor
          for i in $(seq 1 30); do nc -z 127.0.0.1 9050 && break; sleep 1; done
          nc -z 127.0.0.1 9050

      - name: Download public source through rotating Tor exits
        shell: bash
        run: |
          set +e
          set +o pipefail
          URL='https://www.youtube.com/watch?v=qCxf4NoqXU0'
          PROXY='socks5h://127.0.0.1:9050'
          : > tor-download.log
          success=0
          for circuit in $(seq 1 8); do
            echo "===== CIRCUIT $circuit =====" | tee -a tor-download.log
            curl --proxy "$PROXY" -sS https://check.torproject.org/api/ip | tee -a tor-download.log
            for client in web_safari tv tv_embedded mweb android_vr ios web_embedded web; do
              common=(--proxy "$PROXY" --no-playlist --remote-components ejs:github \
                --js-runtimes node --extractor-args "youtube:player_client=$client")
              for spec in '18' '134' 'best[width=360][height=640]' 'bestvideo[width=360][height=640]' 'bestvideo[height<=640]' 'best[height<=640]'; do
                tag=$(printf '%s' "$circuit-$client-$spec" | tr -cs 'A-Za-z0-9' '_')
                out="source-${tag}.%(ext)s"
                echo "TRY circuit=$circuit client=$client format=$spec" | tee -a tor-download.log
                python -m yt_dlp "${common[@]}" --verbose -f "$spec" -o "$out" "$URL" >> tor-download.log 2>&1
                rc=$?
                if [ "$rc" -eq 0 ] && find . -maxdepth 1 -type f -name "source-${tag}.*" -size +1M | grep -q .; then
                  success=1
                  break 3
                fi
              done
            done
            printf 'AUTHENTICATE ""\r\nSIGNAL NEWNYM\r\nQUIT\r\n' | nc 127.0.0.1 9051 >> tor-download.log 2>&1
            sleep 12
          done
          find . -maxdepth 1 -type f -name 'source-*' -size +1M -printf '%f %s bytes\n' | sort | tee source-files.txt
          [ "$success" -eq 1 ] || { echo 'No source video downloaded through Tor exits.' | tee -a tor-download.log; exit 11; }

      - name: Probe exact extraction against immutable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          cat > expected-early.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          EOF
          src=$(find . -maxdepth 1 -type f -name 'source-*' -size +1M | sort | head -1)
          test -n "$src"
          ffprobe -v error -show_streams -show_format "$src" > source.ffprobe.txt
          mkdir probes
          : > probe-results.txt
          match=''
          for vf in 'fps=2' 'fps=2,scale=360:640' 'fps=2,scale=360:640:flags=lanczos'; do
            safe=$(printf '%s' "$vf" | tr -cs 'A-Za-z0-9' '_')
            out="probes/$safe"
            mkdir -p "$out"
            ffmpeg -hide_banner -loglevel warning -t 55 -i "$src" -vf "$vf" -start_number 1 "$out/frame_%06d.jpg"
            ok=1
            while read -r name expected; do
              actual=$(git hash-object "$out/$name")
              echo "$vf $name actual=$actual expected=$expected" | tee -a probe-results.txt
              [ "$actual" = "$expected" ] || ok=0
            done < expected-early.txt
            if [ "$ok" -eq 1 ]; then match="$src|$vf"; break; fi
          done
          printf '%s\n' "$match" > exact-match.txt
          test -n "$match" || { echo 'Source downloaded, but extraction was not byte-identical.' >&2; exit 20; }

      - name: Extract and verify all 3484 original frames
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r src vf < exact-match.txt
          mkdir frames
          ffmpeg -hide_banner -loglevel warning -i "$src" -vf "$vf" -start_number 1 frames/frame_%06d.jpg
          count=$(find frames -maxdepth 1 -type f -name 'frame_*.jpg' | wc -l)
          [ "$count" -eq 3484 ] || { echo "Expected 3484 frames, got $count" >&2; exit 21; }
          cat > expected-full.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          frame_001000.jpg 470e4d441726615196b08f4fbfe3a03f5a8f79a9
          frame_002000.jpg ba6879062f85cf2bbcd6fdece8df21f94e5cf1b3
          frame_003000.jpg 85be8114fa583ac9bdaa6fb3f0ae51b5c78bf097
          frame_003484.jpg 2297b15b6de24058f3a8c63d655fe7a61b0c6a3c
          EOF
          while read -r name expected; do
            actual=$(git hash-object "frames/$name")
            echo "$name actual=$actual expected=$expected"
            [ "$actual" = "$expected" ] || exit 22
          done < expected-full.txt
          find frames -maxdepth 1 -type f -name '*.jpg' -print0 | sort -z | xargs -0 sha256sum > frames-sha256.txt
          {
            echo 'source_video=qCxf4NoqXU0'
            echo 'source_git_commit=9c62d9489d9f057835f8a62af3a620fa6f4a89a0'
            echo "frame_count=$count"
            echo "source_file=$src"
            echo "vf=$vf"
          } > source.txt

      - name: Upload exact original corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-3484-frames-exact
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            frames/
            frames-sha256.txt
            expected-full.txt
            source.txt
            ffmpeg-version.txt
            yt-dlp-version.txt
            source.ffprobe.txt
            probe-results.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-tor-recovery-diagnostics
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
          path: |
            tor-download.log
            source-files.txt
            source-*
            source.ffprobe.txt
            probes/
            expected-early.txt
            probe-results.txt
            exact-match.txt
            ffmpeg-version.txt
            yt-dlp-version.txt
