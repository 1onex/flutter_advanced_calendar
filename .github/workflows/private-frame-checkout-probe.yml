name: Temporary Cobalt source recovery

on:
  push:
    branches:
      - agent/trial-obby-frame-export-test
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  recover-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4

      - name: Install matching FFmpeg and jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          curl -fL --retry 3 -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir ffmpeg-master
          tar -xJf ffmpeg.tar.xz -C ffmpeg-master --strip-components=1
          echo "$PWD/ffmpeg-master/bin" >> "$GITHUB_PATH"
          ffmpeg-master/bin/ffmpeg -version | tee ffmpeg-version.txt

      - name: Request one public-video export per community instance
        shell: bash
        run: |
          set +e
          set +o pipefail
          URL='https://www.youtube.com/watch?v=qCxf4NoqXU0'
          UA='TrialObbyCorpusRecovery/1.0 (+https://github.com/1onex/flutter_advanced_calendar/pull/1)'
          : > cobalt-results.log
          success=0
          for api in \
            'https://capi.3kh0.net' \
            'https://cobalt-api.meowing.de' \
            'https://cobalt-backend.canine.tools'; do
            safe=$(printf '%s' "$api" | sed 's#https://##' | tr -cs 'A-Za-z0-9' '_')
            response="response-${safe}.json"
            echo "===== $api =====" | tee -a cobalt-results.log
            curl -sS --fail-with-body --max-time 90 \
              -A "$UA" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d "{\"url\":\"$URL\",\"videoQuality\":\"360\",\"youtubeVideoCodec\":\"h264\",\"youtubeVideoContainer\":\"mp4\",\"downloadMode\":\"auto\",\"disableMetadata\":true,\"filenameStyle\":\"basic\",\"alwaysProxy\":true}" \
              "$api/" > "$response"
            rc=$?
            echo "curl_rc=$rc" | tee -a cobalt-results.log
            cat "$response" 2>/dev/null | tee -a cobalt-results.log
            status=$(jq -r '.status // empty' "$response" 2>/dev/null)
            media=$(jq -r '.url // empty' "$response" 2>/dev/null)
            if [ "$rc" -eq 0 ] && { [ "$status" = 'tunnel' ] || [ "$status" = 'redirect' ]; } && [ -n "$media" ]; then
              echo "Downloading status=$status from $api" | tee -a cobalt-results.log
              curl -fL --retry 3 --max-time 900 -A "$UA" -o "source-${safe}.bin" "$media"
              if [ -f "source-${safe}.bin" ] && [ "$(stat -c %s "source-${safe}.bin")" -gt 1000000 ]; then
                success=1
                break
              fi
            fi
          done
          find . -maxdepth 1 -type f -name 'source-*.bin' -size +1M -printf '%f %s bytes\n' | tee source-files.txt
          [ "$success" -eq 1 ] || { echo 'No unauthenticated community instance returned a source.' >&2; exit 11; }

      - name: Probe exact extraction against immutable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          src=$(find . -maxdepth 1 -type f -name 'source-*.bin' -size +1M | head -1)
          ffprobe -v error -show_streams -show_format "$src" > source.ffprobe.txt
          cat > expected-early.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          EOF
          mkdir probes
          : > probe-results.txt
          match=''
          for vf in 'fps=2' 'fps=2,scale=360:640' 'fps=2,scale=360:640:flags=lanczos'; do
            safe=$(printf '%s' "$vf" | tr -cs 'A-Za-z0-9' '_')
            out="probes/$safe"
            mkdir -p "$out"
            ffmpeg -hide_banner -loglevel warning -t 55 -i "$src" -vf "$vf" -start_number 1 "$out/frame_%06d.jpg"
            ok=1
            while read -r name expected; do
              actual=$(git hash-object "$out/$name")
              echo "$vf $name actual=$actual expected=$expected" | tee -a probe-results.txt
              [ "$actual" = "$expected" ] || ok=0
            done < expected-early.txt
            if [ "$ok" -eq 1 ]; then match="$src|$vf"; break; fi
          done
          printf '%s\n' "$match" > exact-match.txt
          test -n "$match" || exit 20

      - name: Extract and verify full corpus
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r src vf < exact-match.txt
          mkdir frames
          ffmpeg -hide_banner -loglevel warning -i "$src" -vf "$vf" -start_number 1 frames/frame_%06d.jpg
          count=$(find frames -maxdepth 1 -type f -name 'frame_*.jpg' | wc -l)
          [ "$count" -eq 3484 ] || exit 21
          cat > expected-full.txt <<'EOF'
          frame_000001.jpg adfec80dbfc43cef997df5de03b2df6291fec1d4
          frame_000004.jpg 21e8df3cf8bbf7aa1a951fb0ce2f783284d7e296
          frame_000022.jpg 358b78975b39cd273abfd30f10a5695ffa84d1dc
          frame_000040.jpg e21ca7a595a64bb228ab60c237154b6f3483aa03
          frame_000100.jpg ef63a083343ce009fb982e9e395ccd8c51bd67ad
          frame_001000.jpg 470e4d441726615196b08f4fbfe3a03f5a8f79a9
          frame_002000.jpg ba6879062f85cf2bbcd6fdece8df21f94e5cf1b3
          frame_003000.jpg 85be8114fa583ac9bdaa6fb3f0ae51b5c78bf097
          frame_003484.jpg 2297b15b6de24058f3a8c63d655fe7a61b0c6a3c
          EOF
          while read -r name expected; do
            actual=$(git hash-object "frames/$name")
            [ "$actual" = "$expected" ] || exit 22
          done < expected-full.txt
          find frames -maxdepth 1 -type f -name '*.jpg' -print0 | sort -z | xargs -0 sha256sum > frames-sha256.txt
          printf 'source_video=qCxf4NoqXU0\nsource_git_commit=9c62d9489d9f057835f8a62af3a620fa6f4a89a0\nframe_count=%s\nsource_file=%s\nvf=%s\n' "$count" "$src" "$vf" > source.txt

      - name: Upload exact corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-3484-frames-exact-cobalt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            frames/
            frames-sha256.txt
            expected-full.txt
            source.txt
            ffmpeg-version.txt
            cobalt-results.log
            response-*.json
            source.ffprobe.txt
            probe-results.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-obby-cobalt-recovery-diagnostics
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
          path: |
            cobalt-results.log
            response-*.json
            source-files.txt
            source-*.bin
            source.ffprobe.txt
            probes/
            expected-early.txt
            probe-results.txt
            exact-match.txt
            ffmpeg-version.txt
